@let user = userStore.selectedUser();

@if (user) {
  <ng-container *transloco="let t">
    <div class="modal-header">
      <h2 class="modal-title" id="user-delete-confirmation-dialog-title">{{ t('users.dialog.delete.title') }}</h2>
      <button class="btn-close" [attr.aria-label]="t('shared.close')" [disabled]="saving()" (click)="cancel()"></button>
    </div>
    <div class="modal-body">
      @if (errorMessage()) {
        <span class="alert alert-danger d-block mb-3" role="alert" [attr.data-testid]="'delete-general-error'">
          {{ t(errorMessage()) }}
        </span>
      }
      <p [attr.data-testid]="'delete-confirmation-message'">
        {{ t('users.dialog.delete.confirmationMessage', { firstName: user.firstName, lastName: user.lastName }) }}
      </p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" [disabled]="saving()" (click)="cancel()">
        {{ t('users.dialog.actions.cancel') }}
      </button>
      <button class="btn btn-danger d-flex" ngbAutofocus [disabled]="saving()" (click)="deleteUser()">
        {{ t('users.dialog.actions.delete') }}
        <brn-spinner [class.ms-2]="saving()" [visible]="saving()" [color]="'light'" />
      </button>
    </div>
  </ng-container>
}
