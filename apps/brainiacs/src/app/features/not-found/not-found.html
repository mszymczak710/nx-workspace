<ng-container *transloco="let t">
  <div class="container py-5 d-flex flex-column align-items-center text-center">
    <img class="mb-2" src="/images/not-found.svg" [alt]="" />

    <p class="display-3 fw-medium mb-3 text-primary">404</p>
    <h1 class="h3 mb-2">{{ t('notFound.title') }}</h1>
    <p class="text-secondary mb-4">{{ t('notFound.message') }}</p>

    <button class="btn btn-outline-secondary" [routerLink]="['/home']">
      <i class="fa fa-home me-2" aria-hidden="true"></i>
      {{ t('notFound.button') }}
    </button>
  </div>
</ng-container>
